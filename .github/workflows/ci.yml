name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install --upgrade pip pytest '.[yaml]'
      - run: ffmpeg -version && ffprobe -version && python -c "import yaml; print('PyYAML available')"
      - run: python -m pytest -ra
        env:
          NARRATIVECUT_REQUIRE_FFMPEG: "1"
