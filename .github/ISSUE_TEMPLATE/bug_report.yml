name: Bug report
description: Report a reproducible problem in NarrativeCut
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, input shape, and actual output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0 or commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and FFmpeg version if rendering is involved.
