[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrativecut"
version = "0.1.0"
description = "Deterministic, local-first documentary video compilation core"
requires-python = ">=3.11"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.scripts]
narrativecut = "narrativecut.__main__:main"

[tool.setuptools.packages.find]
include = ["narrativecut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
