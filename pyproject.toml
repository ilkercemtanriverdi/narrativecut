[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxengine-video-studio"
version = "0.1.0"
description = "Deterministic, local-first documentary video compilation core"
requires-python = ">=3.11"

[project.scripts]
fluxengine-video = "fluxengine_video_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["fluxengine_video_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
